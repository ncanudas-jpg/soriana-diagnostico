<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Soriana. Diagnóstico y estrategia.</title>
  <meta name="description" content="Diagnóstico de mercado y financiero de Organización Soriana (BMV: SORIANAB) frente a Chedraui, con propuesta de mejora.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="assets/soriana-icono.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#perfil">Saltar al contenido</a>
  <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

  <header class="nav" id="nav">
    <nav class="nav-inner" aria-label="Secciones">
      <a class="brand" href="#inicio" aria-label="Soriana, inicio"><span class="brand-dot"></span><span class="brand-text">Soriana</span></a>
      <ul class="nav-links" id="navLinks"></ul>
      <div class="nav-actions">
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro / oscuro">◐</button>
        <button class="pill-btn" id="presentBtn" type="button" aria-pressed="false" title="Modo presentación (P)"><span aria-hidden="true">▶</span> Presentar <kbd>P</kbd></button>
      </div>
    </nav>
  </header>

  <main id="main">
    <!-- 1. HERO -->
    <section class="section" id="inicio" aria-label="Portada">
      <div class="slide hero" data-slide="hero">
        <div class="hero-bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
        <div class="hero-inner">
          <p class="eyebrow reveal" id="heroEyebrow"></p>
          <h1 class="display reveal" id="heroTitle"></h1>
          <p class="lead reveal" id="heroSub"></p>
          <div class="logos reveal" id="heroLogos" aria-label="Empresas analizadas"></div>
          <p class="byline reveal" id="heroBy"></p>
        </div>
        <a class="scroll-cue" href="#perfil" aria-label="Bajar al perfil"><span></span></a>
      </div>
    </section>

    <!-- 2. PERFIL -->
    <section class="section" id="perfil" aria-labelledby="h-perfil">
      <div class="slide theme-green" data-slide="perfil">
        <header class="slide-head" data-head="perfil"></header>
        <div class="counters reveal" id="counters"></div>
        <div class="tabs reveal" id="perfilTabs"></div>
      </div>
    </section>

    <!-- 3. DIAGNÓSTICO: PESTEL + FODA con detalle al tocar -->
    <section class="section" id="diagnostico" aria-labelledby="h-diagnostico">
      <div class="slide theme-light" data-slide="diagnostico">
        <header class="slide-head" data-head="diagnostico"></header>
        <div class="diag reveal" id="diag"></div>
      </div>
    </section>

    <!-- 4. MODELO: Canvas + Tendencias -->
    <section class="section" id="modelo" aria-labelledby="h-modelo">
      <div class="slide theme-red" data-slide="modelo">
        <header class="slide-head" data-head="modelo"></header>
        <div class="tabset reveal" id="modeloTabs">
          <div data-pane="canvas"><div class="canvas-grid" id="canvasGrid"></div></div>
          <div data-pane="tendencias">
            <div class="carousel-wrap">
              <div class="carousel" id="carousel" tabindex="0" role="region" aria-label="Carrusel de tendencias"></div>
              <div class="carousel-ctl">
                <button class="icon-btn" id="carPrev" type="button" aria-label="Tendencia anterior">←</button>
                <div class="car-dots" id="carDots"></div>
                <button class="icon-btn" id="carNext" type="button" aria-label="Tendencia siguiente">→</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 5. FINANZAS: una gráfica, cinco temas -->
    <section class="section" id="finanzas" aria-labelledby="h-finanzas">
      <div class="slide theme-light" data-slide="finanzas">
        <header class="slide-head" data-head="finanzas"></header>
        <div class="fin reveal">
          <div class="chips" id="finTemas" role="group" aria-label="Tema financiero"></div>
          <div class="chapter-wrap">
            <div class="chapter-text">
              <div class="chips" id="finVistas" role="group" aria-label="Vista de la gráfica"></div>
              <div class="lectura" aria-live="polite"><b>Lectura</b><span id="finLectura"></span></div>
              <div id="finExtra"></div>
            </div>
            <figure class="card chart-card"><figcaption><strong id="finLabel"></strong> <span id="finUnit"></span></figcaption><div class="chart-box"><canvas id="finChart" role="img"></canvas></div></figure>
          </div>
        </div>
      </div>
    </section>

    <!-- 6. DUELO -->
    <section class="section" id="duelo" aria-labelledby="h-duelo">
      <div class="slide theme-light duel" data-slide="duelo">
        <header class="slide-head" data-head="duelo"></header>
        <div class="vs reveal" id="vsBoard" aria-live="polite"></div>
        <div class="ctl-bar reveal" id="dueloCtl"></div>
        <div class="tabset reveal" id="dueloTabs">
          <div data-pane="tabla">
            <div class="table-wrap"><table class="ratios" id="ratioTable"></table></div>
            <p class="footnote" id="cmpFoot"></p>
          </div>
          <div data-pane="radar">
            <figure class="card chart-card"><figcaption><strong>Radar</strong> · % del tope de cada eje</figcaption><div class="chart-box"><canvas id="radarChart" role="img" aria-label="Radar de crecimiento, márgenes y ROE: Soriana frente a Chedraui"></canvas></div><p class="chart-note" id="radarNote"></p></figure>
          </div>
          <div data-pane="barras">
            <figure class="card chart-card"><figcaption><label for="barGroup"><strong>Barras</strong></label> <select id="barGroup" class="select"></select></figcaption><div class="chart-box"><canvas id="barChart" role="img" aria-label="Barras lado a lado de las razones seleccionadas"></canvas></div></figure>
          </div>
          <div data-pane="cara"><div class="card cmp-slider" id="cmpSlider"></div></div>
          <div data-pane="juego"><div class="card quiz" id="quiz"></div></div>
        </div>
      </div>
    </section>

    <!-- 7. DASHBOARD -->
    <section class="section" id="dashboard" aria-labelledby="h-dashboard">
      <div class="slide theme-light" data-slide="dashboard">
        <header class="slide-head" data-head="dashboard"></header>
        <div class="ctl-bar reveal">
          <div class="seg" role="radiogroup" aria-label="Empresa" id="dashCo"></div>
          <div class="seg" role="radiogroup" aria-label="Año" id="dashYear"></div>
        </div>
        <div class="kpi-grid" id="kpiGrid"></div>
        <p class="footnote" id="dashFoot"></p>
      </div>
    </section>

    <!-- 8. PROPUESTA -->
    <section class="section" id="propuesta" aria-labelledby="h-propuesta">
      <div class="slide theme-green" data-slide="propuesta">
        <header class="slide-head" data-head="propuesta"></header>
        <div class="tabset reveal" id="propTabs">
          <div data-pane="bien"><div class="prop-grid" id="propBien"></div></div>
          <div data-pane="mejora"><div class="prop-grid" id="propMejora"></div></div>
          <div data-pane="ruta">
            <ol class="timeline" id="timeline"></ol>
            <div class="table-wrap"><table class="ratios kpi-meta" id="metaTable"></table></div>
            <p class="footnote" id="metaFoot"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- 9. SIMULADOR -->
    <section class="section" id="simulador" aria-labelledby="h-simulador">
      <div class="slide theme-red" data-slide="simulador">
        <header class="slide-head" data-head="simulador"></header>
        <div class="sim reveal" id="sim"></div>
      </div>
    </section>

    <!-- 10. CIERRE -->
    <section class="section" id="cierre" aria-labelledby="h-cierre">
      <div class="slide theme-finale" data-slide="cierre">
        <header class="slide-head" data-head="cierre"></header>
        <div class="closing reveal" id="closing"></div>
        <details class="sources reveal"><summary>Fuentes y créditos</summary>
          <div class="sources-in"><ol id="sources"></ol><div class="credits" id="credits"></div></div>
        </details>
        <p class="footnote" id="closeFoot"></p>
      </div>
    </section>
  </main>

  <!-- Detalle del Canvas -->
  <dialog id="canvasDialog" class="dialog" aria-labelledby="dlgTitle">
    <form method="dialog">
      <p class="kicker">Modelo Canvas</p>
      <h3 id="dlgTitle"></h3>
      <ul id="dlgList"></ul>
      <button class="pill-btn solid" value="close" autofocus>Cerrar</button>
    </form>
  </dialog>

  <!-- Controles del modo presentación -->
  <div class="pres-ui" id="presUI" hidden>
    <button class="icon-btn" id="presPrev" type="button" aria-label="Diapositiva anterior">←</button>
    <div class="pres-dots" id="presDots" role="tablist" aria-label="Diapositivas"></div>
    <span class="pres-count" id="presCount" aria-live="polite"></span>
    <button class="icon-btn" id="presNext" type="button" aria-label="Diapositiva siguiente">→</button>
    <button class="icon-btn" id="presFull" type="button" aria-label="Pantalla completa (F)" title="Pantalla completa (F)">⛶</button>
    <button class="icon-btn" id="presExit" type="button" aria-label="Salir de la presentación (Esc)" title="Salir (Esc)">✕</button>
  </div>

  <noscript><p style="padding:2rem;text-align:center">Este sitio necesita JavaScript para mostrar las gráficas interactivas.</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
